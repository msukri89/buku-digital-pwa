<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buku Digital Elite</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f5f5f7">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

    <style>
        /* --- RESET & DASAR --- */
        * { box-sizing: border-box; }
        body {
            margin: 0; background-color: #f5f5f7; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; overflow: hidden; -webkit-tap-highlight-color: transparent;
        }

        /* --- LOADER ELITE --- */
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; transition: opacity 0.4s ease;
        }
        .loader-overlay.hide { opacity: 0; pointer-events: none; }
        .spinner {
            width: 44px; height: 44px; border: 3px solid rgba(0,0,0,0.1);
            border-top-color: #1d1d1f; border-radius: 50%;
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { font-size: 14px; font-weight: 500; color: #1d1d1f; letter-spacing: 0.5px; }

        /* --- AREA BACA & ZOOM WRAPPER --- */
        .area-baca { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: auto; }
        #zoom-wrapper { transition: transform 0.2s ease-out; transform-origin: center center; }
        #book-container { display: flex; justify-content: center; align-items: center; }
        #buku { display: block; margin: 0 auto; transition: width 0.3s ease, height 0.3s ease; }
        .lembaran { background-color: #fff; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .lembaran canvas { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* --- MENU KONTROL UTAMA --- */
        .menu-container { 
            position: fixed; z-index: 100; display: flex; padding: 8px; 
            background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 30px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .main-toggle { 
            width: 38px; height: 38px; border-radius: 50%; border: none; 
            background: rgba(255, 255, 255, 0.6); color: #1d1d1f; cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s ease; z-index: 101;
        }
        .main-toggle:active { transform: scale(0.85); background: rgba(255, 255, 255, 0.9); }
        .main-toggle svg { width: 18px; height: 18px; }

        .dock { display: flex; gap: 8px; opacity: 1; transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); overflow: visible; }
        .icon-btn { 
            border: none; background: transparent; color: #444; cursor: pointer; width: 34px; height: 34px; 
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            transition: background 0.3s ease, color 0.3s ease; position: relative;
        }
        .icon-btn svg { width: 18px; height: 18px; }
        .icon-btn:hover { background: rgba(0, 0, 0, 0.05); color: #000; }
        .icon-btn.aktif { background: rgba(0, 0, 0, 0.1); color: #000; }

        /* --- POPUP CONTAINER (ZOOM & SOUND) --- */
        .popup-container {
            position: absolute; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 20px; padding: 8px 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; pointer-events: none; transform: scale(0.8); display: flex; align-items: center; z-index: 99; gap: 8px;
        }
        .popup-container.show { opacity: 1; pointer-events: auto; transform: scale(1); }

        /* Elemen dalam Popup Suara */
        .divider { width: 1px; height: 20px; background: rgba(0,0,0,0.15); margin: 0 2px; }
        .popup-btn {
            border: none; background: transparent; color: #444; cursor: pointer; width: 30px; height: 30px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 14px; font-weight: bold; transition: all 0.2s ease;
        }
        .popup-btn:hover { background: rgba(0,0,0,0.05); }
        .popup-btn.aktif { background: #1d1d1f; color: #fff; }
        .popup-btn svg { width: 16px; height: 16px; }

        /* Slider Zoom */
        input[type=range] { -webkit-appearance: none; width: 130px; background: transparent; margin: 0; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 22px; width: 22px; border-radius: 50%;
            background: #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.2), 0 0 1px rgba(0,0,0,0.5); cursor: pointer; margin-top: -9px;
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(0,0,0,0.15); border-radius: 2px; }

        /* --- ORIENTASI LAYAR --- */
        @media (orientation: landscape) {
            .menu-container { top: 20px; left: 20px; flex-direction: column; align-items: center; }
            .dock { flex-direction: column; padding-top: 8px; transform-origin: top center; }
            .dock.collapsed { max-height: 0; opacity: 0; padding-top: 0; transform: translateY(-15px) scale(0.8); pointer-events: none; }
            .popup-container { left: 65px; top: 50%; transform: translateY(-50%) scale(0.8); }
            .popup-container.show { transform: translateY(-50%) scale(1); }
        }
        @media (orientation: portrait) {
            .menu-container { bottom: 25px; left: 50%; transform: translateX(-50%); flex-direction: row-reverse; align-items: center; }
            .dock { flex-direction: row; padding-right: 8px; transform-origin: right center; }
            .dock.collapsed { max-width: 0; opacity: 0; padding-right: 0; transform: translateX(15px) scale(0.8); pointer-events: none; }
            .popup-container { bottom: 60px; left: 50%; transform: translateX(-50%) scale(0.8); }
            .popup-container.show { transform: translateX(-50%) scale(1); }
        }
    </style>
</head>
<body>

    <div id="loader" class="loader-overlay hide">
        <div class="spinner"></div>
        <div class="loader-text">Memproses Dokumen...</div>
    </div>

    <div id="menu-container" class="menu-container">
        
        <button id="menu-toggle" class="main-toggle" title="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
        </button>

        <div id="dock" class="dock collapsed">
            <label class="icon-btn" title="Pilih PDF">
                <input type="file" id="pdf-upload" accept="application/pdf" style="display: none;" />
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            </label>

            <button id="btn-page-mode" class="icon-btn" title="Mode Halaman">
                <svg id="icon-page-1" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="5" y="3" width="14" height="18" rx="2"></rect>
                    <text x="12" y="16" font-size="11" text-anchor="middle" font-weight="bold" font-family="sans-serif" stroke="none" fill="currentColor">1</text>
                </svg>
                <svg id="icon-page-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M4 4h16v16H4z"></path>
                    <line x1="12" y1="4" x2="12" y2="20"></line>
                    <text x="12" y="16" font-size="11" text-anchor="middle" font-weight="bold" font-family="sans-serif" stroke="none" fill="currentColor">2</text>
                </svg>
            </button>

            <button id="btn-zoom" class="icon-btn" title="Sesuaikan Ukuran">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
            </button>
            
            <button id="btn-ltr" class="icon-btn aktif" title="Kiri ke Kanan">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 16 16 12 12 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            </button>
            
            <button id="btn-rtl" class="icon-btn" title="Kanan ke Kiri (Arab)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 8 8 12 12 16"></polyline><line x1="16" y1="12" x2="8" y2="12"></line></svg>
            </button>

            <button id="btn-vol" class="icon-btn" title="Pengaturan Suara">
                <svg id="main-vol-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                <svg id="main-vol-off" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
            </button>
        </div>

        <div id="zoom-slider-container" class="popup-container">
            <input type="range" id="zoom-slider" min="0.5" max="2.5" step="0.05" value="1">
        </div>

        <div id="sound-popup-container" class="popup-container">
            <button id="btn-mute" class="popup-btn" title="Mute/Unmute">
                <svg id="icon-mute-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                <svg id="icon-mute-on" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
            </button>
            <div class="divider"></div>
            <button class="popup-btn sound-select aktif" data-src="suara1.mp3">1</button>
            <button class="popup-btn sound-select" data-src="suara2.mp3">2</button>
            <button class="popup-btn sound-select" data-src="suara3.mp3">3</button>
            <button class="popup-btn sound-select" data-src="suara4.mp3">4</button>
        </div>
    </div>

    <div class="area-baca" id="area-baca">
        <div id="zoom-wrapper">
            <div id="book-container">
                <div id="buku"></div>
            </div>
        </div>
    </div>

    <audio id="suara-kertas" src="suara1.mp3" preload="auto"></audio>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let pageFlip;
        let suaraKertas = document.getElementById('suara-kertas');
        
        let globalCanvases = []; 
        let modeRTL = false; 
        let suaraAktif = true;
        let audioUnlocked = false;
        let modeHalaman = window.innerWidth > window.innerHeight ? 2 : 1; 

        document.getElementById('icon-page-1').style.display = modeHalaman === 1 ? 'block' : 'none';
        document.getElementById('icon-page-2').style.display = modeHalaman === 2 ? 'block' : 'none';

        // --- INTERAKSI UI ---
        const dock = document.getElementById('dock');
        const menuToggle = document.getElementById('menu-toggle');
        const zoomPopup = document.getElementById('zoom-slider-container');
        const soundPopup = document.getElementById('sound-popup-container');
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomWrapper = document.getElementById('zoom-wrapper');
        const loader = document.getElementById('loader');
        const bookContainer = document.getElementById('book-container');

        // Menutup semua popup
        function closeAllPopups() {
            zoomPopup.classList.remove('show');
            soundPopup.classList.remove('show');
        }

        menuToggle.addEventListener('click', () => {
            dock.classList.toggle('collapsed');
            if (dock.classList.contains('collapsed')) closeAllPopups(); 
        });

        document.getElementById('btn-zoom').addEventListener('click', (e) => {
            soundPopup.classList.remove('show');
            zoomPopup.classList.toggle('show');
            e.stopPropagation();
        });

        document.getElementById('btn-vol').addEventListener('click', (e) => {
            zoomPopup.classList.remove('show');
            soundPopup.classList.toggle('show');
            e.stopPropagation();
        });

        zoomSlider.addEventListener('input', (e) => {
            zoomWrapper.style.transform = `scale(${e.target.value})`;
        });

        document.getElementById('area-baca').addEventListener('touchstart', closeAllPopups, {passive: true});
        document.getElementById('area-baca').addEventListener('click', closeAllPopups);

        // --- LOGIKA AUDIO ---
        function unlockAudio() {
            if (!audioUnlocked && suaraKertas) {
                suaraKertas.play().then(() => {
                    suaraKertas.pause();
                    suaraKertas.currentTime = 0;
                    audioUnlocked = true;
                }).catch(e => console.log("Menunggu sentuhan user"));
            }
        }
        document.body.addEventListener('click', unlockAudio, { once: true });
        document.body.addEventListener('touchstart', unlockAudio, { once: true });

        function mainkanSuara() {
            if (suaraKertas && suaraAktif) {
                suaraKertas.currentTime = 0;
                suaraKertas.play().catch(e => console.log("Audio diblokir browser"));
            }
        }

        // Toggle Mute
        document.getElementById('btn-mute').addEventListener('click', (e) => {
            suaraAktif = !suaraAktif;
            // Update Ikon di Popup
            document.getElementById('icon-mute-off').style.display = suaraAktif ? 'block' : 'none';
            document.getElementById('icon-mute-on').style.display = suaraAktif ? 'none' : 'block';
            // Update Ikon di Menu Utama
            document.getElementById('main-vol-on').style.display = suaraAktif ? 'block' : 'none';
            document.getElementById('main-vol-off').style.display = suaraAktif ? 'none' : 'block';
            e.stopPropagation(); // Mencegah popup tertutup
        });

        // Pilih Suara
        const soundSelects = document.querySelectorAll('.sound-select');
        soundSelects.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Hapus highlight dari tombol lain
                soundSelects.forEach(b => b.classList.remove('aktif'));
                btn.classList.add('aktif');
                // Ganti sumber file mp3
                suaraKertas.src = btn.getAttribute('data-src');
                
                // Mainkan preview
                if(suaraAktif && audioUnlocked) {
                    suaraKertas.currentTime = 0;
                    suaraKertas.play().catch(err=>console.log(err));
                }
                e.stopPropagation();
            });
        });

        // --- TOMBOL TOGGLE (RTL & Mode Halaman) ---
        const btnLtr = document.getElementById('btn-ltr');
        const btnRtl = document.getElementById('btn-rtl');
        btnLtr.addEventListener('click', () => { modeRTL = false; btnLtr.classList.add('aktif'); btnRtl.classList.remove('aktif'); if(globalCanvases.length) initFlipbook(); });
        btnRtl.addEventListener('click', () => { modeRTL = true; btnRtl.classList.add('aktif'); btnLtr.classList.remove('aktif'); if(globalCanvases.length) initFlipbook(); });

        document.getElementById('btn-page-mode').addEventListener('click', () => {
            modeHalaman = modeHalaman === 1 ? 2 : 1;
            document.getElementById('icon-page-1').style.display = modeHalaman === 1 ? 'block' : 'none';
            document.getElementById('icon-page-2').style.display = modeHalaman === 2 ? 'block' : 'none';
            if(globalCanvases.length) initFlipbook();
        });

        // --- UPLOAD ---
        document.getElementById('pdf-upload').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if(!file) return;
            
            loader.classList.remove('hide'); 
            zoomSlider.value = 1;
            zoomWrapper.style.transform = `scale(1)`;
            
            let fileReader = new FileReader();
            fileReader.onload = function() {
                let typedarray = new Uint8Array(this.result);
                pdfjsLib.getDocument(typedarray).promise.then(async pdf => {
                    globalCanvases = [];
                    let jumlahHalaman = pdf.numPages;
                    for (let i = 1; i <= jumlahHalaman; i++) {
                        let page = await pdf.getPage(i);
                        let viewport = page.getViewport({ scale: 2.0 }); 
                        let canvas = document.createElement('canvas');
                        let ctx = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                        globalCanvases.push(canvas);
                    }
                    loader.classList.add('hide'); 
                    dock.classList.remove('collapsed');
                    initFlipbook();
                });
            };
            fileReader.readAsArrayBuffer(file);
            this.value = ''; 
        });

        // --- INIT FLIPBOOK (ANTI-CRASH) ---
        function initFlipbook() {
            if(pageFlip) { 
                pageFlip.destroy(); 
                pageFlip = null; 
            }
            
            bookContainer.innerHTML = '<div id="buku"></div>';
            let bukuDiv = document.getElementById('buku');

            let renderList = [];
            globalCanvases.forEach(originalCanvas => {
                let divHalaman = document.createElement('div');
                divHalaman.className = 'lembaran';
                let clone = document.createElement('canvas');
                clone.width = originalCanvas.width;
                clone.height = originalCanvas.height;
                clone.getContext('2d').drawImage(originalCanvas, 0, 0);
                divHalaman.appendChild(clone);
                renderList.push(divHalaman);
            });

            if (modeRTL) renderList.reverse();
            renderList.forEach(hal => bukuDiv.appendChild(hal));

            let canvasPertama = renderList[0].querySelector('canvas');
            let rasioHalaman = canvasPertama ? (canvasPertama.width / canvasPertama.height) : 0.707;
            
            let areaBaca = document.getElementById('area-baca');
            let wTersedia = areaBaca.clientWidth;
            let hTersedia = areaBaca.clientHeight;
            
            let paddingY = 30; 
            let paddingX = window.innerWidth > window.innerHeight ? 80 : 30; 
            
            let targetH = hTersedia - paddingY;
            let targetW = targetH * rasioHalaman;
            let containerW;

            if (modeHalaman === 2) {
                if ((targetW * 2) > (wTersedia - paddingX)) {
                    targetW = (wTersedia - paddingX) / 2;
                    targetH = targetW / rasioHalaman;
                }
                containerW = targetW * 2;
            } else {
                if (targetW > (wTersedia - paddingX)) {
                    targetW = wTersedia - paddingX;
                    targetH = targetW / rasioHalaman;
                }
                containerW = targetW;
            }
            
            bukuDiv.style.width = Math.floor(containerW) + 'px';
            bukuDiv.style.height = Math.floor(targetH) + 'px';

            pageFlip = new St.PageFlip(bukuDiv, {
                width: Math.floor(targetW),
                height: Math.floor(targetH),
                size: "fixed",
                usePortrait: modeHalaman === 1,
                minWidth: 200, maxWidth: 2500,
                minHeight: 300, maxHeight: 3000,
                showCover: true, 
                maxShadowOpacity: 0.1, 
                drawShadow: true, 
                flippingTime: 850 
            });

            pageFlip.loadFromHTML(bukuDiv.querySelectorAll('.lembaran'));
            pageFlip.on('flip', mainkanSuara);
        }

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(err => {});
    </script>
</body>
</html>
