<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buku Digital Elite</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f5f5f7">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

    <style>
        /* --- RESET & DASAR --- */
        * { box-sizing: border-box; }
        body {
            margin: 0; 
            background-color: #f5f5f7; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh; 
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }

        /* --- AREA BACA & ZOOM WRAPPER --- */
        .area-baca { 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: auto; /* Mengizinkan scroll halus jika buku di-zoom sangat besar */
        }
        
        #zoom-wrapper {
            transition: transform 0.1s ease-out; /* Animasi mulus saat slider digeser */
            transform-origin: center center;
        }

        #buku { display: block; margin: 0 auto; }
        
        .lembaran { 
            background-color: #fff; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .lembaran canvas { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
        }

        /* --- MENU KONTROL (GLASSMORPHISM & ANIMASI SPRING) --- */
        .menu-container { 
            position: fixed; 
            z-index: 100; 
            display: flex; 
            padding: 8px; /* Diperkecil */
            background: rgba(255, 255, 255, 0.25); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.4); 
            border-radius: 30px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .main-toggle { 
            width: 38px; /* Diperkecil dari 46px agar lebih elegan */
            height: 38px; 
            border-radius: 50%; 
            border: none; 
            background: rgba(255, 255, 255, 0.5); 
            color: #1d1d1f;
            cursor: pointer; 
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s ease;
            z-index: 101;
        }
        .main-toggle:active { transform: scale(0.85); background: rgba(255, 255, 255, 0.8); }
        .main-toggle svg { width: 18px; height: 18px; } /* SVG lebih kecil */

        .dock { 
            display: flex; 
            gap: 8px; /* Jarak antar tombol diperkecil */
            opacity: 1;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); 
            overflow: visible; 
        }

        .icon-btn { 
            border: none; 
            background: transparent; 
            color: #444; 
            cursor: pointer; 
            width: 34px; /* Diperkecil dari 42px */
            height: 34px; 
            border-radius: 50%; 
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease, color 0.3s ease; 
            position: relative;
        }
        .icon-btn svg { width: 18px; height: 18px; } /* SVG lebih kecil */
        .icon-btn:hover { background: rgba(0, 0, 0, 0.05); color: #000; }
        .icon-btn.aktif { background: rgba(0, 0, 0, 0.1); color: #000; }

        /* --- POPUP ZOOM SLIDER ALA IOS --- */
        .zoom-popup {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 8px 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
            display: flex;
            align-items: center;
            z-index: 99;
        }
        .zoom-popup.show {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        /* Modifikasi Range Input agar Elite */
        input[type=range] {
            -webkit-appearance: none;
            width: 130px;
            background: transparent;
            margin: 0;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2), 0 0 1px rgba(0,0,0,0.5);
            cursor: pointer;
            margin-top: -9px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(0,0,0,0.15);
            border-radius: 2px;
        }

        /* --- ORIENTASI LAYAR --- */
        /* Landscape: Menu Kiri Atas */
        @media (orientation: landscape) {
            .menu-container { top: 20px; left: 20px; flex-direction: column; align-items: center; }
            .dock { flex-direction: column; padding-top: 8px; transform-origin: top center; }
            .dock.collapsed { max-height: 0; opacity: 0; padding-top: 0; transform: translateY(-15px) scale(0.8); pointer-events: none; }
            
            .zoom-popup {
                left: 65px; /* Muncul di sebelah kanan tombol menu */
                top: 50%;
                transform: translateY(-50%) scale(0.8);
            }
            .zoom-popup.show { transform: translateY(-50%) scale(1); }
        }

        /* Portrait: Menu Tengah Bawah */
        @media (orientation: portrait) {
            .menu-container { bottom: 25px; left: 50%; transform: translateX(-50%); flex-direction: row-reverse; align-items: center; }
            .dock { flex-direction: row; padding-right: 8px; transform-origin: right center; }
            .dock.collapsed { max-width: 0; opacity: 0; padding-right: 0; transform: translateX(15px) scale(0.8); pointer-events: none; }
            
            .zoom-popup {
                bottom: 60px; /* Muncul di atas tombol menu */
                left: 50%;
                transform: translateX(-50%) scale(0.8);
            }
            .zoom-popup.show { transform: translateX(-50%) scale(1); }
        }
    </style>
</head>
<body>

    <div id="menu-container" class="menu-container">
        
        <button id="menu-toggle" class="main-toggle" title="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
        </button>

        <div id="dock" class="dock collapsed">
            <label class="icon-btn" title="Pilih PDF">
                <input type="file" id="pdf-upload" accept="application/pdf" style="display: none;" />
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            </label>

            <button id="btn-zoom" class="icon-btn" title="Sesuaikan Ukuran">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
            </button>
            
            <button id="btn-ltr" class="icon-btn aktif" title="Kiri ke Kanan">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 16 16 12 12 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            </button>
            
            <button id="btn-rtl" class="icon-btn" title="Kanan ke Kiri (Arab)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 8 8 12 12 16"></polyline><line x1="16" y1="12" x2="8" y2="12"></line></svg>
            </button>

            <button id="btn-vol" class="icon-btn" title="Suara Kertas">
                <svg id="icon-vol-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                <svg id="icon-vol-off" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
            </button>
        </div>

        <div id="zoom-slider-container" class="zoom-popup">
            <input type="range" id="zoom-slider" min="0.5" max="2.5" step="0.05" value="1">
        </div>
    </div>

    <div class="area-baca" id="area-baca">
        <div id="zoom-wrapper">
            <div id="buku"></div>
        </div>
    </div>

    <audio id="suara-kertas" src="https://actions.google.com/sounds/v1/foley/paper_rustle.ogg" preload="auto"></audio>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let pageFlip;
        let suaraKertas = document.getElementById('suara-kertas');
        let modeRTL = false; 
        let suaraAktif = true;
        let audioUnlocked = false;

        // --- INTERAKSI UI ---
        const dock = document.getElementById('dock');
        const menuToggle = document.getElementById('menu-toggle');
        const zoomPopup = document.getElementById('zoom-slider-container');
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomWrapper = document.getElementById('zoom-wrapper');

        // Toggle Menu Utama
        menuToggle.addEventListener('click', () => {
            dock.classList.toggle('collapsed');
            if (dock.classList.contains('collapsed')) {
                zoomPopup.classList.remove('show'); // Tutup juga zoom jika menu ditutup
            }
        });

        // Toggle Zoom Popup
        document.getElementById('btn-zoom').addEventListener('click', (e) => {
            zoomPopup.classList.toggle('show');
            e.stopPropagation();
        });

        // Logika Slider Zoom
        zoomSlider.addEventListener('input', (e) => {
            zoomWrapper.style.transform = `scale(${e.target.value})`;
        });

        // Sembunyikan zoom slider jika layar disentuh di area lain
        document.getElementById('area-baca').addEventListener('touchstart', () => {
            zoomPopup.classList.remove('show');
        }, {passive: true});
        document.getElementById('area-baca').addEventListener('click', () => {
            zoomPopup.classList.remove('show');
        });

        // Buka Kunci Audio Browser
        function unlockAudio() {
            if (!audioUnlocked && suaraKertas) {
                suaraKertas.play().then(() => {
                    suaraKertas.pause();
                    suaraKertas.currentTime = 0;
                    audioUnlocked = true;
                }).catch(e => console.log("Menunggu interaksi layar"));
            }
        }
        document.body.addEventListener('click', unlockAudio, { once: true });
        document.body.addEventListener('touchstart', unlockAudio, { once: true });

        function mainkanSuara() {
            if (suaraKertas && suaraAktif && audioUnlocked) {
                suaraKertas.currentTime = 0;
                suaraKertas.play().catch(e => console.log("Audio diblokir"));
            }
        }

        // Toggle LTR / RTL
        const btnLtr = document.getElementById('btn-ltr');
        const btnRtl = document.getElementById('btn-rtl');
        btnLtr.addEventListener('click', () => { modeRTL = false; btnLtr.classList.add('aktif'); btnRtl.classList.remove('aktif'); });
        btnRtl.addEventListener('click', () => { modeRTL = true; btnRtl.classList.add('aktif'); btnLtr.classList.remove('aktif'); });

        // Toggle Volume
        document.getElementById('btn-vol').addEventListener('click', () => {
            suaraAktif = !suaraAktif;
            document.getElementById('icon-vol-on').style.display = suaraAktif ? 'block' : 'none';
            document.getElementById('icon-vol-off').style.display = suaraAktif ? 'none' : 'block';
        });

        // --- UPLOAD & RENDER ---
        document.getElementById('pdf-upload').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if(!file) return;
            let fileReader = new FileReader();
            fileReader.onload = function() {
                let typedarray = new Uint8Array(this.result);
                // Reset zoom saat file baru diunggah
                zoomSlider.value = 1;
                zoomWrapper.style.transform = `scale(1)`;
                pdfjsLib.getDocument(typedarray).promise.then(pdf => renderBuku(pdf));
            };
            fileReader.readAsArrayBuffer(file);
            dock.classList.remove('collapsed');
        });

        async function renderBuku(pdf) {
            let bukuDiv = document.getElementById('buku');
            bukuDiv.innerHTML = ''; 
            if(pageFlip) { pageFlip.destroy(); pageFlip = null; }

            let jumlahHalaman = pdf.numPages;
            let daftarHalaman = [];

            // Mesin ekstraksi berjalan persis seperti sebelumnya
            for (let i = 1; i <= jumlahHalaman; i++) {
                let page = await pdf.getPage(i);
                let viewport = page.getViewport({ scale: 2.0 }); 
                let divHalaman = document.createElement('div');
                divHalaman.className = 'lembaran';
                let canvas = document.createElement('canvas');
                let ctx = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                divHalaman.appendChild(canvas);
                daftarHalaman.push(divHalaman);
            }
            if (modeRTL) daftarHalaman.reverse();
            daftarHalaman.forEach(hal => bukuDiv.appendChild(hal));

            // KALKULASI DIMENSI DEFAULT (Diperbesar dari versi sebelumnya)
            let canvasPertama = bukuDiv.querySelector('canvas');
            let rasioHalaman = canvasPertama ? (canvasPertama.width / canvasPertama.height) : 0.707;
            
            let areaBaca = document.getElementById('area-baca');
            let wTersedia = areaBaca.clientWidth;
            let hTersedia = areaBaca.clientHeight;
            let isLandscape = wTersedia > hTersedia;

            // Margin aman diperkecil drastis agar buku default lebih besar mengisi layar
            let paddingY = isLandscape ? 10 : 30; 
            let paddingX = isLandscape ? 60 : 10; 

            let targetH = hTersedia - paddingY;
            let targetW = targetH * rasioHalaman;

            if (isLandscape) {
                if ((targetW * 2) > (wTersedia - paddingX)) {
                    targetW = (wTersedia - paddingX) / 2;
                    targetH = targetW / rasioHalaman;
                }
            } else {
                if (targetW > (wTersedia - paddingX)) {
                    targetW = wTersedia - paddingX;
                    targetH = targetW / rasioHalaman;
                }
            }

            // Inisialisasi buku
            pageFlip = new St.PageFlip(bukuDiv, {
                width: Math.floor(targetW),
                height: Math.floor(targetH),
                size: "fixed",
                minWidth: 200, maxWidth: 2500,
                minHeight: 300, maxHeight: 3000,
                showCover: true, 
                usePortrait: true,
                maxShadowOpacity: 0.08, 
                drawShadow: true, 
                flippingTime: 850 
            });

            pageFlip.loadFromHTML(bukuDiv.querySelectorAll('.lembaran'));
            pageFlip.on('flip', mainkanSuara);
        }

        // PWA Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }
    </script>
</body>
</html>
